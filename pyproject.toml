[project]
name = "nncg"
version = "0.5.0"
description = "Non-negative conjugate gradients: bound-constrained SPD quadratics by a guarded active-set loop"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "cvx-linalg>=0.9.6",
    "numpy>=2.0.0",
]

authors = [{name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com"},
           {name = "Martin Stoll", email = "martin.stoll@mathematik.tu-chemnitz.de"}]

[project.urls]
Homepage = "https://github.com/Jebel-Quant/nncg"
Repository = "https://github.com/Jebel-Quant/nncg"
Paper = "https://github.com/Jebel-Quant/mean_variance_solvers"

[dependency-groups]
dev = [
    "marimo>=0.18.0",  # drives `make book` notebook export (book/marimo/notebooks/)
    "matplotlib>=3.8",  # notebooks plot with matplotlib (book/marimo/notebooks/)
]
test = [
    "pytest>=7.0",
    "pytest-timeout>=2.3",
]

# make a fresh `uv run pytest` work without knowing about dependency groups.
# The type checkers are not declared here: the synced typecheck target
# provisions them itself with `uv run --with ty` / `uv run --with mypy`.
[tool.uv]
default-groups = ["dev", "test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nncg"]

[tool.rhiza-task]
# Settings for the task runner that replaced the synced make layer in rhiza v1.4.0.
# `.rhiza/rhiza.mk` and the ten fragments under `.rhiza/make.d/` are gone; the
# root Makefile is now the shim `uvx rhiza-task shim > Makefile` emits, so `make
# test` / `make fmt` / `make typecheck` still work and CLAUDE.md's instructions
# still hold — they just delegate to the pinned CLI instead of to synced make.
#
# Read as layer 3 of rhiza-task's resolution order (defaults -> .rhiza/.env ->
# pyproject.toml -> RHIZA_* environment). `.rhiza/.env` was itself template-owned
# and the sync deleted it, so this table is now the only place the two overrides
# it carried can live. Only entries that differ from the CLI's defaults belong
# here; `uvx rhiza-task print <setting>` shows what one resolves to.

# The retired `.rhiza/.env` set `MARIMO_FOLDER=book/marimo/notebooks`; the CLI
# defaults to `docs/notebooks`. This is the load-bearing entry: `book` exports the
# notebooks in this folder to docs/notebooks/*.html, which is exactly what
# mkdocs.yml's Notebooks nav references, and rhiza_marimo.yml reads the setting via
# `rhiza-task print marimo_folder` to build its notebook matrix. Left at the default
# both would look at an empty `docs/notebooks`, export nothing, and leave five nav
# entries pointing at pages that were never built.
marimo-folder = "book/marimo/notebooks"

# CLAUDE.md's "Test layout" section and [tool.check_test_layout].reason below both
# justify this repo's grouped suite by saying full line coverage of every source
# module is guaranteed by the coverage gate. Under the retired python.mk that gate
# was `COVERAGE_FAIL_UNDER ?= 90`, which the repo never overrode — so the claim was
# documented but not enforced, and 10 percentage points of it were free. The suite
# measures 100% on every module today, so pinning the gate at 100 makes the two
# statements one. The `test` task passes --cov-fail-under on the command line, which
# would outrank a [tool.coverage.report] fail_under; this repo has no such table, so
# there is nothing to keep in step.
coverage-fail-under = 100

# The retired python.mk had `TYPECHECKER ?= both`; the CLI defaults to `ty` alone,
# so a bare migration would have dropped `mypy --strict` from this repo's typecheck
# gate -- the one CLAUDE.md describes. `both` is also stricter here than it was under
# make: the shell `case` let mypy's exit status win, so a ty failure could pass, where
# the CLI raises on each run. Both checkers are clean on src/nncg at the time of this
# migration, so nothing is being deferred by turning them both on.
typechecker = "both"

# The retired quality.mk pinned `RHIZA_CHECKS_VERSION ?= 0.2.1`; the CLI defaults to
# v0.2.0, so a bare migration would have *downgraded* the conformance checks -- the
# drift the pin exists to prevent. v0.2.2 is out; bumping to it is a separate upgrade
# decision and not this migration's to make.
pytest-rhiza = "pytest-rhiza @ git+https://github.com/Jebel-Quant/pytest-rhiza@v0.2.1"

# Not set, on purpose:
#   source-folder      -- the default `src` is already this repo's layout, and the
#       retired `.rhiza/.env` pinned it to that same value.
#   layers             -- `python` is detected from pyproject.toml, and this repo has
#       no second language layer for the inference to get wrong.
#   mkdocs-extra-packages -- the old root Makefile carried
#       `MKDOCS_EXTRA_PACKAGES = --with 'mkdocstrings[python]'` for the api.md reference
#       page; rhiza-task 0.3.1 makes mkdocstrings[python] the default, so the override
#       is now redundant rather than lost. Restore it here if that default ever changes.

[tool.bumpversion]
# Lives in pyproject.toml because that is one of the four filenames
# bump-my-version auto-discovers (.bumpversion.toml, .bumpversion.cfg,
# setup.cfg, pyproject.toml). A block anywhere else is inert, and inert is
# silent: with no config found the tool falls back to `git describe` and a
# release can be cut at a version that already exists. This replaces the
# `.rhiza/.cfg.toml` copy that rhiza v1.3.0 stopped shipping.
#
# No `current_version` and no [[tool.bumpversion.files]] entry for
# [project].version: bump-my-version reads and rewrites the PEP 621 field
# natively, so the number is declared exactly once, on line 3. Add a
# [[tool.bumpversion.files]] entry only for an *additional* location — this
# repo has none; CHANGELOG.md is regenerated, not rewritten in place.
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:[-]?(?P<release>[a-z]+)[\\.]?(?P<pre_n>\\d+))?(?:\\+build\\.(?P<build_n>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}-{release}.{pre_n}+build.{build_n}",
    "{major}.{minor}.{patch}+build.{build_n}",
    "{major}.{minor}.{patch}-{release}.{pre_n}",
    "{major}.{minor}.{patch}",
]
allow_dirty = false
# /rhiza:release commits and tags itself so the changelog lands in the bump
# commit; a bare `bump-my-version bump` must not add a second commit or a
# duplicate tag.
commit = false
tag = false

[tool.bumpversion.parts.release]
optional_value = "prod"
values = ["dev", "alpha", "a", "beta", "b", "rc", "prod"]

[tool.interrogate]
# Nested helpers defined inside tests are throwaway implementation detail,
# not documented API.
ignore-nested-functions = true
ignore-nested-classes = true

[tool.check_test_layout]
# Accepted deviation from Rhiza's 1:1 mirroring — see the "Test layout" section
# of CLAUDE.md for the full rationale. This table makes that decision
# machine-readable so scripts/check_test_layout.py reports it as intentional
# instead of as 18 missing/orphan files.
enforce = false
reason = "Tests are grouped by concern under tests/test_nncg/ and by paper claim under tests/test_paper/ rather than mirrored one-to-one onto src/nncg/; internal primitives (_active_set, _equality, certificate) are exercised end-to-end through test_solver.py by design, and full line coverage of every source module is guaranteed by the pytest coverage gate."

[tool.deptry.package_module_name_map]
numpy = "numpy"
cvx-linalg = "cvx"
osqp = "osqp"
clarabel = "clarabel"
scipy = "scipy"
